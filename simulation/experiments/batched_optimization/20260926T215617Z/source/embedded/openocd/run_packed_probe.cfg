# Только RAM. Вызывать после успешной сборки нужного пакета.
proc run_packed_probe {} {
    global env
    set elf $env(PACK_ELF)
    set trace $env(PACK_TRACE)
    init
    set failed [catch {
    halt
    load_image $elf
    verify_image $elf
    if {[info exists env(PACK_INPUT)]} {
        load_image $env(PACK_INPUT) 0x20000000 bin
        verify_image $env(PACK_INPUT) 0x20000000 bin
    }
    mww 0xe000ed94 0x00000000
    mww 0x2000d000 0x51acb00f 256
    reg msp 0x2000f000
    resume 0x00000409
    sleep 1000
    halt
    set done [read_memory 0x2000fffc 32 1]
    echo "PACK_DONE $done"
    if {[lindex $done 0] != 0x444f4e45} {error "probe did not finish"}
    echo "PACK_PROFILE_0 [read_memory 0x2000f800 32 40]"
    echo "PACK_PROFILE_1 [read_memory 0x2000f900 32 40]"
    echo "PACK_PROFILE_2 [read_memory 0x2000fa00 32 40]"
    set guard [read_memory 0x2000d000 32 256]
    foreach word $guard {if {$word != 0x51acb00f} {error "stack crossed trace guard"}}
    echo "PACK_STACK_GUARD_OK"
    dump_image $trace 0x20001000 49152
    } problem]
    reset run
    if {$failed} {echo "PACK_ERROR $problem"}
    shutdown
}

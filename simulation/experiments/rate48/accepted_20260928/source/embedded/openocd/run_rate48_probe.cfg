# RAM-only, полная запись порциями, собственная память между порциями сохраняется.
proc run_rate48_probe {} {
 global env
 init
 set failed [catch {
  halt
  stm32h7r3.cpu0 configure -work-area-phys 0x2000b900 -work-area-size 0x400 -work-area-backup 1
  load_image $env(RATE_ELF)
  verify_image $env(RATE_ELF)
  mww 0xe000ed94 0
  mww 0x2000bd00 0x51acb00f 192
  mww 0x2000ff00 0
  reg msp 0x2000f000
  set entry [lindex [read_memory 0x00000404 32 1] 0]
  resume $entry
  sleep 30
  if {[lindex [read_memory 0x2000ff00 32 1] 0] != 0x52454144} {error "initial ready missing"}
  halt
  for {set i 0} {$i < $env(RATE_COUNT)} {incr i} {
   set input [format "%s/%04d.bin" $env(RATE_CHUNKS) $i]
   set n [expr {[file size $input] / 2}]
   load_image $input 0x20000000 bin
   verify_image $input 0x20000000 bin
   mww 0x2000ff04 $n
   mww 0x2000ff08 $env(RATE_PEAK)
   mww 0x2000ff00 0x474f474f
   resume
   set ready 0
   for {set poll 0} {$poll < 600} {incr poll} {
    sleep 100
    set flag [lindex [read_memory 0x2000ff00 32 1] 0]
    if {$flag == 0x52454144} {set ready 1; break}
    if {$flag == 0x45525221 || $flag == 0x50414e49} {error "firmware error $flag"}
   }
   halt
   if {!$ready} {error "chunk timeout $i"}
   foreach word [read_memory 0x2000bd00 32 192] {if {$word != 0x51acb00f} {error "stack guard damaged"}}
   echo "RATE_CHUNK $i [read_memory 0x2000ff00 32 6]"
   dump_image [format "%s/chunk%04d.bin" $env(RATE_OUT) $i] 0x20008000 14592
  }
  mww 0x2000ff04 0
  mww 0x2000ff00 0x474f474f
  resume
  sleep 20
  halt
  if {[lindex [read_memory 0x2000ff00 32 1] 0] != 0x444f4e45} {error "final done missing"}
  echo "RATE_COMPLETE"
 } problem]
    reset run
    sleep 300
    halt
    echo "POST_RESET_PC [reg pc]"
    echo "POST_RESET_XPSR [reg xPSR]"
    set faults [read_memory 0xe000ed28 32 2]
    echo "POST_RESET_FAULTS $faults"
    set pc_text [reg pc]
    set psr_text [reg xPSR]
    set reset_ok 1
    if {![regexp {0x([0-9a-fA-F]+)} $pc_text all hex]} {set reset_ok 0} else {
        set pc [expr "0x$hex"]
        if {$pc < 0x90000000 || $pc >= 0x91000000} {set reset_ok 0}
    }
    if {![regexp {0x([0-9a-fA-F]+)} $psr_text all hex]} {set reset_ok 0} else {
        if {[expr "0x$hex & 0x1ff"] != 0} {set reset_ok 0}
    }
    foreach word $faults {if {$word != 0} {set reset_ok 0}}
    resume
    sleep 17
    halt
    echo "POST_RESUME_PC [reg pc]"
    resume
    if {$reset_ok} {echo "PACK_RESET_VERIFIED"} else {echo "PACK_ERROR reset verification failed"}
 if {$failed} {echo "RATE_ERROR $problem"}
 shutdown
}

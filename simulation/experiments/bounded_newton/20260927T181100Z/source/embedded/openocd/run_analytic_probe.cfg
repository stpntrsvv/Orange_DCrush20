# Только RAM. Вызывать после успешной сборки нужного пакета.
proc run_packed_probe {} {
    global env
    set elf $env(PACK_ELF)
    set trace $env(PACK_TRACE)
    init
    set failed [catch {
    halt
    # verify_image запускает служебный checksum-код в work area. Он не должен
    # перезаписать входную таблицу в начале DTCM до старта опыта.
    stm32h7r3.cpu0 configure -work-area-phys 0x2000e000 -work-area-size 0x1000 -work-area-backup 1
    load_image $elf
    verify_image $elf
    if {[info exists env(PACK_INPUT)]} {
        load_image $env(PACK_INPUT) 0x20000000 bin
        verify_image $env(PACK_INPUT) 0x20000000 bin
    }
    mww 0xe000ed94 0x00000000
    mww 0x2000d000 0x51acb00f 256
    reg msp 0x2000f000
    resume 0x00000409
    sleep 1000
    halt
    set done [read_memory 0x2000fffc 32 1]
    echo "PACK_DONE $done"
    if {[lindex $done 0] != 0x444f4e45} {error "probe did not finish"}
    echo "PACK_PROFILE_0 [read_memory 0x2000f800 32 40]"
    echo "PACK_PROFILE_1 [read_memory 0x2000f900 32 40]"
    echo "PACK_PROFILE_2 [read_memory 0x2000fa00 32 40]"
    if {[info exists env(PACK_COUNTS)]} {
        echo "PACK_COUNTS_0 [read_memory 0x2000fb00 32 55]"
        echo "PACK_COUNTS_1 [read_memory 0x2000fc00 32 55]"
        echo "PACK_COUNTS_2 [read_memory 0x2000fd00 32 55]"
    }
    set guard [read_memory 0x2000d000 32 256]
    foreach word $guard {if {$word != 0x51acb00f} {error "stack crossed trace guard"}}
    echo "PACK_STACK_GUARD_OK"
    dump_image $trace 0x20001000 49152
    } problem]
    reset run
    sleep 300
    halt
    echo "POST_RESET_PC [reg pc]"
    echo "POST_RESET_XPSR [reg xPSR]"
    set faults [read_memory 0xe000ed28 32 2]
    echo "POST_RESET_FAULTS $faults"
    set pc_text [reg pc]
    set psr_text [reg xPSR]
    set reset_ok 1
    if {![regexp {0x([0-9a-fA-F]+)} $pc_text all hex]} {set reset_ok 0} else {
        set pc [expr "0x$hex"]
        if {$pc < 0x90000000 || $pc >= 0x91000000} {set reset_ok 0}
    }
    if {![regexp {0x([0-9a-fA-F]+)} $psr_text all hex]} {set reset_ok 0} else {
        if {[expr "0x$hex & 0x1ff"] != 0} {set reset_ok 0}
    }
    foreach word $faults {if {$word != 0} {set reset_ok 0}}
    resume
    sleep 17
    halt
    echo "POST_RESUME_PC [reg pc]"
    resume
    if {$reset_ok} {echo "PACK_RESET_VERIFIED"} else {echo "PACK_ERROR reset verification failed"}
    if {$failed} {echo "PACK_ERROR $problem"}
    shutdown
}

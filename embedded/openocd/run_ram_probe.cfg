proc run_ram_probe {} {
    init
    halt

    load_image firmware/target/thumbv7em-none-eabihf/release/ram-probe
    verify_image firmware/target/thumbv7em-none-eabihf/release/ram-probe

    mww 0xe000ed94 0x00000000
    reg msp 0x2000f000
    resume 0x00000409
    sleep 1000
    halt

    # Нелинейности, residual, прямое линейное распространение,
    # baseline (32 повтора), локальные блоки, восстановление, ORNG,
    # полная поправка, max(error/tolerance) fixture + 6 ветвей, DONE.
    # При --features reuse-probe: суммы cached/uncached, максимумы,
    # число итераций, отказы, REUS, число измеренных шагов, расхождения, DONE.
    set result [read_memory 0x2000ffd8 32 10]
    echo "RAM_PROBE $result"
    if {[lindex $result 6] == 0x53544550} {
        echo "STEP_PROFILE_0 [read_memory 0x2000f800 32 30]"
        echo "STEP_PROFILE_1 [read_memory 0x2000f880 32 30]"
        echo "STEP_PROFILE_2 [read_memory 0x2000f900 32 30]"
    }

    # Return to the unchanged factory application in external XSPI flash.
    reset run
    shutdown
}

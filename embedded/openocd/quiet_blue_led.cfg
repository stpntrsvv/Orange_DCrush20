# WeAct STM32H7R3Zx CoreBoard V1.0: штатная программа мигает синим LED на PB2.
# После reset/power cycle штатный MX_GPIO_Init() снова делает PB2 выходом.
# Этот скрипт меняет только режим PB2 в RAM-регистре GPIOB, без записи flash.

proc quiet_blue_led {} {
    halt
    set moder [lindex [read_memory 0x58020400 32 1] 0]
    set old_mode [expr {($moder >> 4) & 3}]
    if {$old_mode != 1 && $old_mode != 3} {
        resume
        error "PB2 mode $old_mode unexpected; LED not changed"
    }
    set quiet [expr {($moder & ~(3 << 4)) | (3 << 4)}]
    write_memory 0x58020400 32 [list $quiet]
    set actual [lindex [read_memory 0x58020400 32 1] 0]
    resume
    if {$actual != $quiet} {error "PB2 mode write did not persist"}
    echo "BLUE_LED_QUIET: PB2 analog, GPIOB_MODER=[format 0x%08x $actual]"
}

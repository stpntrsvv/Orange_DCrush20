# WeAct Studio STM32H7R3Zx CoreBoard V1.0.
#
# OpenOCD 0.12.0's generic stm32h7x.cfg attaches the Cortex-M target to AP0.
# STM32H7R3 exposes the application Cortex-M7 through AP1, as also recorded by
# the board vendor's STM32CubeIDE launch configuration.
#
# This file intentionally declares no flash bank.  It is safe for attaching,
# halting, register/memory inspection and RAM-loaded timing harnesses.  External
# XSPI programming at 0x90000000 needs the board-specific loader and is a
# separate operation.

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/swj-dp.tcl]

set CHIPNAME stm32h7r3
set CPUTAPID 0x6ba02477

swj_newdap $CHIPNAME cpu \
    -irlen 4 \
    -ircapture 0x1 \
    -irmask 0xf \
    -expected-id $CPUTAPID

dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu0 cortex_m \
    -endian little \
    -dap $CHIPNAME.dap \
    -ap-num 1

$CHIPNAME.cpu0 configure \
    -work-area-phys 0x20000000 \
    -work-area-size 0x10000 \
    -work-area-backup 0

$CHIPNAME.cpu0 cortex_m reset_config sysresetreq
adapter speed 1000
targets $CHIPNAME.cpu0
